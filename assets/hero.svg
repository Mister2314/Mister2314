  <path d="M40 40v56" stroke="url(#accent)" stroke-width="3" stroke-linecap="square"/>
  <path d="M1240 300h-56" stroke="url(#accent)" stroke-width="3" stroke-linecap="square"/>
  <path d="M1240 300v-56" stroke="url(#accent)" stroke-width="3" stroke-linecap="square"/>

  <text x="80" y="158"
